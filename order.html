<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Order</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F7F4EF; --surface:#FFFFFF; --surface2:#FBF8F3; --line:#E7E0D6;
    --ink:#1F1B16; --ink2:#4A423A; --muted:#8A8178; --muted2:#6E655C;
    --accent:#E2592B; --accentDark:#C4441B; --green:#17803D; --red:#C4291C;
    --safeB:env(safe-area-inset-bottom,0px);
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + var(--safeB));
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  button{font-family:inherit;cursor:pointer}

  header{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:14px 16px calc(14px);position:sticky;top:0;z-index:20;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
  }
  header .r{display:flex;align-items:center;gap:10px}
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.25px;flex:1;min-width:0;
    overflow-wrap:anywhere}
  .lang{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);
    border-radius:22px;padding:0 16px;min-height:44px;min-width:56px;
    font-size:13px;font-weight:700;color:var(--ink2);
  }
  header .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

  .cats{
    display:flex;gap:7px;overflow-x:auto;padding:11px 16px;
    background:var(--bg);border-bottom:1px solid var(--line);
    position:sticky;z-index:19;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cats button{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
    border-radius:22px;padding:0 16px;min-height:44px;font-size:13.5px;font-weight:650;
    color:var(--ink2);white-space:nowrap;
  }
  .cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .wrap{padding:14px 16px 0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:340px){ .grid{grid-template-columns:1fr} }
  .item{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 12px 11px;text-align:left;display:flex;flex-direction:column;gap:5px;
    min-height:82px;
  }
  .item .n{font-size:14px;font-weight:650;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
  .item .p{font-size:14px;font-weight:800;color:var(--accent);margin-top:auto}
  .item.has{border-color:var(--accent);background:#FFF7F4;box-shadow:0 0 0 1px var(--accent) inset}
  .itemwrap .cnt{
    position:absolute;top:-7px;right:-7px;z-index:2;
    background:var(--accent);color:#fff;
    min-width:23px;height:23px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:800;padding:0 6px;
    box-shadow:0 2px 6px -1px rgba(226,89,43,.55);
  }
  .itemwrap{position:relative;display:block;height:100%}
  .itemwrap .item{width:100%;height:100%}
  .catHead{
    font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);margin:18px 0 9px;
  }
  .catHead:first-child{margin-top:4px}

  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safeB));
    box-shadow:0 -6px 24px -18px rgba(0,0,0,.5);
  }
  .bar button{
    width:100%;min-height:52px;border:0;border-radius:14px;background:var(--ink);color:#fff;
    font-size:16px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .bar button:disabled{opacity:.4}
  .bar .pill{
    background:rgba(255,255,255,.22);border-radius:20px;padding:2px 9px;font-size:13px;font-weight:800;
  }

  .sheet{
    position:fixed;inset:0;z-index:40;background:rgba(25,20,16,.5);
    display:none;align-items:flex-end;
  }
  .sheet.on{display:flex}
  .sheet .in{
    background:var(--surface);width:100%;max-height:86vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safeB));
    -webkit-overflow-scrolling:touch;
  }
  .sheet h2{margin:0 0 3px;font-size:18px;font-weight:800}
  .sheet .hint{font-size:13px;color:var(--muted2);margin:0 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .chips button{
    border:1px solid var(--line);background:var(--surface2);border-radius:23px;
    padding:0 17px;min-height:46px;font-size:14px;font-weight:650;color:var(--ink2);
  }
  .chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .line{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  }
  .line:last-of-type{border-bottom:0}
  .line .nm{flex:1;min-width:0}
  .line .nm b{display:block;font-size:14.5px;font-weight:650;overflow-wrap:anywhere}
  .line .nm span{display:block;font-size:12px;color:var(--accent);margin-top:2px}
  .line .nm .pr{color:var(--muted);font-size:12px}
  .qty{display:flex;align-items:center;gap:0;flex:0 0 auto;border:1px solid var(--line);
    border-radius:11px;overflow:hidden;background:var(--surface2)}
  .qty button{width:46px;height:46px;border:0;background:transparent;font-size:18px;
    font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .qty b{min-width:26px;text-align:center;font-size:15px;font-weight:800}
  .noteBtn{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);border-radius:11px;
    padding:0 13px;min-height:44px;font-size:13px;font-weight:650;color:var(--ink2);
  }
  .noteBtn.on{border-color:var(--accent);color:var(--accent);background:#FFF3EE}

  .tot{display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 0 4px;font-size:15px}
  .tot b{font-size:23px;font-weight:800}
  input[type=text]{
    width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;
    background:var(--surface2);font-size:16px;color:var(--ink);min-height:50px;outline:none;
    font-family:inherit;
  }
  input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
  .go{
    width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:#fff;
    font-size:16.5px;font-weight:800;margin-top:12px;
  }
  .fieldlbl{
    display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted2);margin:14px 0 6px;
  }
  .fieldlbl em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:600}
  .linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);
    text-decoration:underline;cursor:pointer}
  .why{font-size:12px;color:var(--muted);margin:6px 0 0}
  .paypick{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .paypick button{
    display:flex;align-items:center;gap:11px;text-align:left;width:100%;
    border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;
    padding:13px 14px;min-height:62px;color:var(--ink);
  }
  .paypick button.on{border-color:var(--accent);background:#FFF5F1}
  .paypick .tick{
    flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;
  }
  .paypick button.on .tick{background:var(--accent);border-color:var(--accent)}
  .paypick .tx b{display:block;font-size:14.5px;font-weight:700}
  .paypick .tx span{display:block;font-size:12.5px;color:var(--muted2);margin-top:1px}
  .qrwrap{text-align:center;margin:4px 0 0}
  .qrwrap img{
    width:min(72vw,280px);height:auto;border-radius:12px;border:1px solid var(--line);
    background:#fff;display:block;margin:10px auto 0;
  }
  .qramt{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.5px;margin-top:4px}
  .warn{
    background:#FFF2DE;color:#8A5200;border:1px solid #F0D9A8;border-radius:11px;
    padding:10px 13px;font-size:12.5px;font-weight:650;margin-top:14px;
  }
  .reason{
    max-width:360px;margin:20px auto 0;background:#FDECEA;border:1px solid #F3C9C3;
    border-radius:14px;padding:13px 15px;text-align:left;
  }
  .reason b{
    display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#A32116;margin-bottom:4px;
  }
  .reason span{display:block;font-size:14.5px;color:var(--ink);overflow-wrap:anywhere}
  .alertask{
    max-width:360px;margin:18px auto 0;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px 15px;text-align:left;
  }
  .alertask b{display:block;font-size:14px;font-weight:700}
  .alertask span{display:block;font-size:12.5px;color:var(--muted2);margin-top:2px}
  .alertask button{
    width:100%;min-height:46px;margin-top:11px;border:1.5px solid var(--accent);
    background:transparent;border-radius:12px;color:var(--accent);font-size:14.5px;font-weight:700;
  }
  .alertok{
    max-width:360px;margin:18px auto 0;font-size:12.5px;color:var(--green);
    font-weight:650;text-align:center;
  }
  .claimtag{
    display:inline-block;margin-top:12px;background:#FFF2DE;color:#8A5200;
    border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:750;
  }
  .go:disabled{opacity:.45}
  .ghostbtn{
    width:100%;min-height:46px;border:1px solid var(--line);background:transparent;
    border-radius:13px;color:var(--ink2);font-size:14.5px;font-weight:650;margin-top:9px;
  }

  .state{padding:40px 22px;text-align:center}
  .state .big{font-size:54px;font-weight:800;letter-spacing:-2px;color:var(--accent);
    line-height:1;margin-bottom:6px}
  .state h2{margin:0 0 7px;font-size:21px;font-weight:800}
  .state p{margin:0;color:var(--muted2);font-size:15px;max-width:34ch;margin-inline:auto}
  .dotrow{display:flex;justify-content:center;gap:7px;margin:22px 0 0}
  .dotrow i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
  .dotrow i.on{background:var(--accent)}
  .badge{
    display:inline-block;margin-top:16px;padding:9px 18px;border-radius:22px;
    font-size:13.5px;font-weight:800;letter-spacing:.02em;
  }
  .state h2.st-ready{color:#0F6030}
  .state h2.st-no{color:var(--red)}
  .badge.wait{background:#FFF2DE;color:#8A5200}
  .badge.prep{background:#FFF0EA;color:var(--accentDark)}
  .badge.ready{background:#E4F3E9;color:#0F6030}
  .badge.no{background:#FDECEA;color:#A32116}
  .recap{
    text-align:left;max-width:360px;margin:22px auto 0;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px 15px;
  }
  .recap li{list-style:none;display:flex;gap:9px;padding:5px 0;font-size:13.5px}
  .recap ul{margin:0;padding:0}
  .recap .q{font-weight:800;min-width:24px}
  .recap .o{display:block;color:var(--accent);font-size:12px;margin-top:1px}
  .recap .sum{display:flex;justify-content:space-between;border-top:1px solid var(--line);
    margin-top:9px;padding-top:9px;font-weight:800}

  .msg{padding:54px 24px;text-align:center;color:var(--muted2)}
  .msg h2{color:var(--ink);font-size:19px;margin:0 0 8px;font-weight:800}
  .msg p{margin:0;font-size:14.5px;max-width:32ch;margin-inline:auto}
  .spin{
    width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation-duration:2.4s} }

  footer{
    text-align:center;padding:26px 16px 10px;color:var(--muted);font-size:11px;line-height:1.7;
  }
  footer b{color:var(--muted2);font-weight:700;letter-spacing:.04em}
  .toast{
    position:fixed;left:50%;bottom:calc(104px + var(--safeB));transform:translateX(-50%) translateY(14px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;
    font-weight:650;opacity:0;transition:.22s;pointer-events:none;z-index:60;max-width:86vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* The customer is not watching this screen - they are queueing or on
   Instagram. Every change of state has to reach them by sound, vibration and,
   if they allow it, a notification. */
var AC=null;
function unlockAudio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C) return;
    if(!AC) AC=new C();
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
}
function tone(freq,start,dur,vol){
  try{
    if(!AC) return;
    var o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type='sine'; o.frequency.value=freq;
    var t0=AC.currentTime+start;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
/* Rising for good news, falling for bad - recognisable without looking. */
function sound(kind){
  unlockAudio();
  /* resume() is asynchronous. Scheduling notes on a context that is still
     suspended plays nothing at all and reports no error, so wait for it. */
  try{
    if(AC && AC.state==='suspended'){
      var p=AC.resume();
      if(p&&p.then){ p.then(function(){ playSound(kind); },function(){}); return; }
    }
  }catch(e){}
  playSound(kind);
}
function playSound(kind){
  if(kind==='good'){
    tone(784,0,0.16,0.5); tone(1047,0.15,0.18,0.5); tone(1319,0.31,0.34,0.5);
    tone(784,0.75,0.16,0.45); tone(1047,0.90,0.18,0.45); tone(1319,1.06,0.36,0.45);
  } else if(kind==='bad'){
    tone(520,0,0.22,0.45); tone(392,0.22,0.42,0.45);
  } else {
    tone(880,0,0.14,0.35); tone(1100,0.13,0.20,0.35);
  }
}

/* ---- network ---- */
function req(method,path,body,ok,fail){
  var x=new XMLHttpRequest();
  x.open(method,DB.replace(/\/+$/,'')+path+'.json',true);
  if(body) x.setRequestHeader('Content-Type','application/json');
  x.timeout=15000;
  x.onreadystatechange=function(){
    if(x.readyState!==4) return;
    var d=null; try{ d=JSON.parse(x.responseText); }catch(e){}
    if(x.status>=200&&x.status<300) ok(d);
    else fail(x.status===401||x.status===403?'denied':'http');
  };
  x.ontimeout=function(){ fail('net'); };
  x.onerror=function(){ fail('net'); };
  try{ x.send(body?JSON.stringify(body):null); }catch(e){ fail('net'); }
}

function render(){

  var y=window.pageYOffset||document.documentElement.scrollTop||0;
  var catX=0, cEl=document.querySelector('.cats');
  if(cEl) catX=cEl.scrollLeft;

  var hadFocus=whoEl&&document.activeElement===whoEl;

  if(view==='status'&&myOrder){ el.innerHTML=renderStatus(); window.scrollTo(0,0); return; }
  if(!M){ return; }

  if(view==='cart'&&cart.length) h+=renderCart();
  if(view==='pay'&&cart.length) h+=renderPay();
  if(noteFor>=0) h+=renderNote();

  var c2=document.querySelector('.cats');
  if(c2&&catX) c2.scrollLeft=catX;
  var w2=$('who');
  if(w2) w2.value = (whoVal!==null?whoVal:(draftName||WHO.name));
  if(w2&&hadFocus){ try{ w2.focus(); w2.setSelectionRange(w2.value.length,w2.value.length); }catch(e){} }
  var p2=$('ph');
  if(p2) p2.value = (phVal!==null?phVal:(draftPhone||WHO.phone));
  var s2=document.querySelector('.sheet.on .in');
  if(s2&&sheetY) s2.scrollTop=sheetY;
  window.scrollTo(0,y);
}

/* ---- actions ---- */
function addItem(name){
  var it=null;
  (M.items||[]).forEach(function(i){ if(i.n===name) it=i; });
  if(!it) return;
  var found=null;
  cart.forEach(function(l){ if(l.n===it.n && (!l.o||!l.o.length)) found=l; });
  if(found) found.q++;
  else cart.push({n:it.n,p:+it.p||0,q:1,o:[]});
  buzz(8); render();
}
var draftName='', draftPhone='';
function grabFields(){
  var a=$('who'), b=$('ph');
  if(a) draftName=a.value.trim();
  if(b) draftPhone=b.value.trim();
  if(!draftName) draftName=WHO.name;
  if(!draftPhone) draftPhone=WHO.phone;
}
/* One place decides whether the details are good enough, so the check cannot
   differ between "send now" and "go and pay first". */
function badFields(){
  grabFields();
  if(!draftName) return ['needName','who'];
  if(!draftPhone) return ['needPhone','ph'];
  if(draftPhone && draftPhone.replace(/[^0-9]/g,'').length<7) return ['badPhone','ph'];
  return null;
}
function complain(bad){
  toast(t(bad[0]));
  var e=$(bad[1]); if(e){ try{ e.focus(); }catch(err){} }
}
function send(){
  if(sending||!cart.length) return;
  var bad=badFields();
  if(bad){ complain(bad); return; }
  var who=draftName, ph=draftPhone;
  sending=true; render();
  var items=cart.map(function(l){
    var o={n:l.n,p:l.p,q:l.q};
    if(l.o&&l.o.length) o.o=l.o.slice();
    return o;
  });
  var body={name:who.slice(0,40),at:Date.now(),total:cartTotal(),items:items,pay:payMode};
  if(ph) body.phone=ph.slice(0,20);
  req('POST','/incoming/'+encodeURIComponent(code),body,function(d){
    sending=false;
    var id=d&&d.name;
    if(!id){ toast(t('sendFail')); render(); return; }
    myOrder={id:id,ref:id.slice(-4).toUpperCase(),state:'',items:items,
             total:body.total,at:Date.now(),no:0,pay:payMode};
    whoSave(who,ph);
    cart=[]; view='status'; draftName=''; draftPhone=''; save(); buzz(30); render(); startPoll();
  },function(e){
    sending=false;
    toast(e==='denied'?t('sendClosed'):t('sendFail'));
    render();
  });
}

function announce(st){
  /* Before the stall accepts there is no order number yet, so do not invent
     one - say "your order" rather than showing an internal reference. */
  var no=(myOrder&&myOrder.no) ? ('#'+myOrder.no) : t('yourOrder').toLowerCase();
  if(st==='ready'){
    sound('good'); vib([90,70,90,70,180]);
    notify(t('notifReady'), t('notifReadyB').replace('%n',no));
    toast(t('readyT'));
  } else if(st==='cancelled'||st==='rejected'){
    sound('bad'); vib([200,120,200]);
    notify(t('notifCancel'), t('notifCancelB').replace('%n',no));
    toast(st==='cancelled'?t('cancelT'):t('rejT'));
    clearInterval(pollT);
  } else if(st==='preparing'){
    sound('ok'); vib([70,50,70]);
    notify(t('notifPrep'), t('notifPrepB').replace('%n',no));
  } else if(st==='done'){
    sound('ok'); vib(90);
    clearInterval(pollT);
  }
}

function loadShopPhone(){
  if(shopPhone||!code) return;
  req('GET','/lic/'+encodeURIComponent(code),null,function(l){
    if(l&&l.phone){ shopPhone=String(l.phone); if(view==='status') render(); }
  },function(){});
}
function startPoll(){
  loadShopPhone();
  clearInterval(pollT);
  if(!myOrder) return;
  pollT=setInterval(checkOrder,6000);
  checkOrder();
}
function checkOrder(){
  if(!myOrder||document.hidden) return;
  req('GET','/incoming/'+encodeURIComponent(code)+'/'+encodeURIComponent(myOrder.id),null,function(d){
    if(d===null){
      /* the stall removed it - it has been collected and closed off */
      if(myOrder.state!=='rejected'&&myOrder.state!=='cancelled'&&myOrder.state!=='done'){
        myOrder.state='done'; save(); render(); announce('done');
      }
      clearInterval(pollT);
      return;
    }
    var changed=false, newState=false;
    if(d.state&&d.state!==myOrder.state){ myOrder.state=d.state; changed=true; newState=true; }
    if(d.no&&d.no!==myOrder.no){ myOrder.no=d.no; changed=true; }
    if(typeof d.note==='string' && d.note!==myOrder.note){ myOrder.note=d.note; changed=true; }
    if(changed){ save(); render(); }
    if(newState) announce(myOrder.state);
  },function(){});
}

document.addEventListener('click',function(e){
  unlockAudio();
  var b=e.target.closest('button');

  if(e.target.id==='paySheet'){ grabFields(); view='cart'; render(); return; }
  if(e.target.id==='cartSheet'){ grabFields(); view='menu'; render(); return; }
  if(e.target.id==='noteSheet'){ noteFor=-1; render(); return; }
  if(!b) return;

  if(b.id==='langBtn'){ lang=(lang==='en'?'ms':'en'); save(); render(); return; }
  if(b.id==='retry'){ boot(); return; }

  if(b.dataset.cat!==undefined){ activeCat=b.dataset.cat||null; render(); return; }
  if(b.dataset.add!==undefined){ addItem(b.dataset.add); return; }
  if(b.id==='openCart'){ view='cart'; render(); return; }
  if(b.id==='closeCart'){ grabFields(); view='menu'; render(); return; }

  if(b.dataset.inc!==undefined){ cart[+b.dataset.inc].q++; buzz(6); render(); return; }
  if(b.dataset.dec!==undefined){
    var i=+b.dataset.dec;
    cart[i].q--; if(cart[i].q<=0) cart.splice(i,1);
    buzz(6);
    if(!cart.length) view='menu';
    render(); return;
  }
  if(b.dataset.note!==undefined){ noteFor=+b.dataset.note; render(); return; }
  if(b.dataset.opt!==undefined){
    var l=cart[noteFor]; if(!l) return;
    if(!l.o) l.o=[];
    var k=l.o.indexOf(b.dataset.opt);
    if(k>=0) l.o.splice(k,1); else l.o.push(b.dataset.opt);
    buzz(6); render(); return;
  }
  if(b.id==='noteDone'){ noteFor=-1; render(); return; }
  if(b.dataset.pay){ grabFields(); payMode=b.dataset.pay; render(); return; }
  if(b.id==='payCancel'){ payMode='counter'; view='cart'; render(); return; }
  if(b.id==='paidBtn'){ send(); return; }
  if(b.id==='waBtn'){
    grabFields();
    var msg=t('waMsg').replace('%s',draftName||'-')
              .replace('%a',money(cartTotal())).replace('%r',(M&&M.shop)||'');
    var to=waNum(shopPhone);
    if(to) window.open('https://wa.me/'+to+'?text='+encodeURIComponent(msg),'_blank');
    return;
  }
  if(b.id==='sendBtn'){
    var bad=badFields();
    if(bad){ complain(bad); return; }
    if(payMode==='claimed'){ view='pay'; render(); loadPayQR(); return; }
    send(); return;
  }
  if(b.id==='askAlerts'){ askAlerts(); return; }
  if(b.id==='forgetMe'){ whoForget(); return; }
  if(b.id==='cxAsk'){ ask='cancel'; render(); return; }
  if(b.id==='cxWa'){ cancelWhatsApp(); return; }
  if(b.id==='cxWalk'||b.id==='cxClose'){ ask=''; render(); return; }
  if(b.id==='agBack'){ ask=''; render(); return; }
  if(b.id==='agGo'){
    ask=''; myOrder=null; view='menu'; cart=[]; payMode='counter';
    clearInterval(pollT); save(); render(); return;
  }
  if(b.id==='again'){
    /* never let a live order be abandoned by accident - the stall is cooking it */
    var liveNow = myOrder && myOrder.state!=='cancelled' && myOrder.state!=='rejected' &&
                  myOrder.state!=='done';
    if(liveNow){ ask='again'; render(); return; }
    myOrder=null; view='menu'; cart=[]; payMode='counter'; clearInterval(pollT); save(); render(); return;
  }
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkOrder(); });

/* ---- boot ---- */
function boot(){
  whoLoad();
  var el=$('app');
  if(!code){ el.innerHTML=msg(t('noShop'),t('noShopSub'),false); return; }
  el.innerHTML='<div class="msg"><div class="spin"></div><p>'+esc(t('loading'))+'</p></div>';
  req('GET','/menu/'+encodeURIComponent(code),null,function(d){
    if(!d||!d.items||!d.items.length){
      /* no menu yet - is this a real shop that is closed, or a wrong code? */
      req('GET','/lic/'+encodeURIComponent(code),null,function(l){
        el.innerHTML = l ? msg(t('closedT'),t('closedSub'),true)
                         : msg(t('badShop'),t('badShopSub'),false);
      },function(){ el.innerHTML=msg(t('closedT'),t('closedSub'),true); });
      return;
    }
    M=d;
    load();
    if(myOrder){ view='status'; render(); startPoll(); }
    else render();
  },function(e){
    if(e==='denied') el.innerHTML=msg(t('closedT'),t('closedSub'),true);
    else if(e==='net') el.innerHTML=msg(t('offline'),t('offlineSub'),true);
    else el.innerHTML=msg(t('badShop'),t('badShopSub'),true);
  });
}
boot();

})();
</script>
